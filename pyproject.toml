[project]
name = "synapse"
version = "0.1.0"
description = "Shared working memory for AI-assisted teams"
requires-python = ">=3.12"
dependencies = [
    "synapse-contracts",
    "synapse-providers",
    "synapse-distiller",
    "synapse-worker",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
synapse-contracts = { workspace = true }
synapse-providers = { workspace = true }
synapse-distiller = { workspace = true }
synapse-worker = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-httpserver>=1.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
