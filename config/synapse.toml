# Synapse configuration.
#
# Every value here can be overridden by an environment variable (see config.py
# for the mapping) so a bake-off can sweep models or prompt packs without
# editing this file:
#
#   $env:SYNAPSE_MODEL       = "qualcomm/Qwen3-4B-Instruct-2507:W4A16"
#   $env:SYNAPSE_PROMPT_PACK = "v2-hardened"
#   uv run python scripts/run_npu_eval.py

[distiller]
model = "qualcomm/Qwen3-4B-Instruct-2507:W4A16"

# v4-condense: the NPU compresses and abstracts, it does not judge importance.
# v1-v3 asked a 4B to also decide durability, granularity and classification,
# and it failed all three while succeeding at compression.
#
# Measured 2026-08-04 on seg-001, distil_kinds = ["text"], labelled:
#
#                        types produced        the reuse-ratio claim
#   v2-hardened          2 of 4                "enabling sustained reuse"  WRONG
#   v4-condense          4 of 4                "lower reuse ratio"         RIGHT
#
# v4 also stopped merging the dead_end into the decision. The fidelity rule
# ("never reverse a comparison, never turn a drawback into a benefit") is what
# fixed the inversion — the model was misstating facts while composing a
# narrative, and stops when asked only to restate.
#
# TRADE-OFFS, both real:
#   * Identifier leakage got WORSE. verbatim overlap rose 0.00 -> 0.10 and the
#     seg-004 notes copy two filenames. Compression pulls wording toward the
#     source. The identifier-leak metric is now the priority.
#   * Cost rose. 1853 prompt tokens vs 1673, and more output per segment, since
#     one note per point produces more findings than one merged narrative.
prompt_pack = "v4-condense"

# Which AgentEvent kinds reach the model. Valid: text, thinking, tool_use,
# tool_result.
#
# Default is text-only, for three reasons:
#   1. Assistant prose is already a frontier model's distillation of its own
#      work — Plan A.5 says to weight retained content toward it.
#   2. It roughly halves the prompt (51% of seg-001's characters, 40% of
#      seg-004's), which matters on a 4096-token bundle at ~11 tok/s.
#   3. Most quotable identifiers live in tool_use arguments and tool_result
#      output, so restricting to prose shrinks the leak surface by construction
#      rather than by a prompt rule the model has been observed to ignore.
#
# Trade-off: a dead_end needs the error that caused it. In seg-001 the assistant
# restates the error in prose, so the finding survives — but an agent that pivots
# without narrating why would lose it. Widen to include tool_result if the
# dead_end recall measured by the eval harness drops.
distil_kinds = ["text"]

# How much structure wraps each event's content.
#   "content"   the prose alone, blocks separated by blank lines
#   "labelled"  prefixed with role / kind / tool name
#
# TESTED 2026-08-04, back-to-back, same pack and kinds, temperature 0:
#   content   1661 prompt tokens · seg-001 decision factually INVERTED
#   labelled  1673 prompt tokens · seg-001 decision correct
#
# "content" saves 12 tokens — 0.7%, because role labels are ~3 tokens each — and
# in that run it flipped a fact. Not worth it. Kept as an option for re-testing
# on a larger corpus, but "labelled" is the default.
#
# Independent of the above: "content" is only coherent while distil_kinds is
# homogeneous. Add tool_use or tool_result and "labelled" is required, since the
# tool name carries which step failed — usually the load-bearing detail in a
# dead_end.
render_style = "labelled"

# Bounds how much prompt can be prefilled per call. Combined with the model's
# measured prefill rate, this is the second of the two limits on segment size.
max_seconds_per_call = 30.0

# Pinned, not left to derive. Left unset, a 1M-context model (the Anthropic
# arm below) would fail OPEN: no ceiling to hit, so the derived budget comes
# out near the full context and the segmenter emits ~90,000-token segments
# silently -- one finding for an entire conversation. That is the OPPOSITE
# of the NPU's fail-CLOSED behaviour (CapabilityError the moment a config
# implies an unusable budget -- see capability.py). Pinning closes that gap
# for both arms at once.
#
# 2787 is exactly what the NPU's own record derives on its own (4096 usable
# context - 809 prompt overhead - 500 response reserve -- see
# [capability."qualcomm/Qwen3-4B-Instruct-2507:W4A16"] below and
# config/prompts/v4-condense.toml's [calibration]), so this pin is a NO-OP
# for the NPU arm: it does not change a single segment the NPU path already
# produces. What it does do is force the Anthropic arm to emit the SAME
# 2787-token segments instead of its own much larger derived value --
# without that, an A/B comparison between the two arms would be measuring
# different-sized inputs, not different models. See
# packages/distiller/tests/test_config.py for the test that pins this.
#   env: SYNAPSE_SEGMENT_BUDGET
segment_budget = 2787

[worker]
# How often to check the transcript for new content.
#
# Cheap to lower: a tick with no new bytes costs a single stat() call, because
# the follower compares file size before opening anything. The expensive step is
# distillation, and that only runs when a turn has actually closed. Latency here
# barely matters — findings are not user-facing in real time, and one segment
# takes ~10s on the NPU regardless.
#   env: SYNAPSE_POLL_INTERVAL
poll_interval_seconds = 30.0

# A turn is only known to be complete once the next one begins, so the newest
# turn is always held back. Without this, the last turn of a conversation would
# sit in the buffer forever after the developer stops typing.
#   env: SYNAPSE_IDLE_FLUSH
idle_flush_seconds = 120.0

# Offset, pending-turn buffer, and the write-ahead log all live here.
state_dir = ".synapse"

# "file" writes upstream pushes to sink_file — the orchestrator does not exist
# yet, so this is what "upstream" means for now. "http" POSTs Finding[] to
# upstream_url. Both use the identical serialization and the identical
# write-ahead path.
sink = "file"
sink_file = ".synapse/upstream.jsonl"
upstream_url = "http://127.0.0.1:8787/producer/findings"

# Start from the end of an already-running conversation rather than distilling
# its whole history. A live transcript is routinely multiple megabytes; from
# scratch that is hours of NPU time for context nobody asked for.
attach_at_end = true

# --- the WORKER -> PROVIDER seam (synapse_worker.limiter) --------------------
# NOT the service's merge governor (ADR 0005) — that one bounds how often the
# SERVICE calls the synthesis model. These three bound what THIS worker asks of
# the distiller's provider. Before 2026-08-06 nothing did: one tick distilled
# every drained segment back to back (FLOW.md §1.3 item 8).

# The RATE. At most this many segments reach the provider per tick; the rest are
# DEFERRED, never dropped, and reported in the tick summary. One distillation is
# ~10s on the NPU against a 30s poll interval, so ~3 is what a tick's own period
# pays for; 4 leaves headroom to catch up after a quiet stretch.
#   env: SYNAPSE_MAX_CALLS_PER_TICK
max_calls_per_tick = 4

# The CONCURRENCY CEILING, enforced by a semaphore every worker->provider call
# holds. 1 because the shipped distiller arm is one local NPU serving one
# request at a time ([provider] base_url below); the cloud arms
# (SYNAPSE_DISTILLER=anthropic / claude-cli) genuinely do serve concurrent
# calls, which is why this is a number and not a constant.
#   env: SYNAPSE_MAX_CONCURRENT_CALLS
max_concurrent_calls = 1

# The VISIBLE BOUND on the backlog, enforced at both ends: the deferred queue is
# never filled past this many segments, and while work is held back the loop
# stops reading new transcript bytes — backpressure, not shedding. The unread
# bytes stay on disk behind the follower's offset and are picked up as soon as
# there is room, so nothing is lost by waiting. 64 is ~8 minutes of backlog at
# 4/tick / 30s.
#   env: SYNAPSE_MAX_DEFERRED_SEGMENTS
max_deferred_segments = 64

[provider]
base_url = "http://127.0.0.1:18181/v1"
max_tokens = 900
temperature = 0.0
timeout_s = 300.0

# One block per model. usable_context and prefill_toks_per_sec must be MEASURED
# on the target hardware — model cards are wrong about both. Prompt overhead is
# deliberately absent: it is derived from the prompt pack, so editing a prompt
# re-budgets automatically instead of leaving a stale number here.
[capability."qualcomm/Qwen3-4B-Instruct-2507:W4A16"]
usable_context = 4096          # measured 2026-08-04; hard ceiling, no --nctx on qairt
prefill_toks_per_sec = 250.0   # PROVISIONAL — needs a seed-pinned measurement
response_reserve = 500
notes = "QAIRT/W4A16, NPU-exclusive, Snapdragon X Elite X1E80100."

# The Anthropic arm (SYNAPSE_DISTILLER=anthropic / SYNAPSE_SYNTHESIZER=anthropic
# -- see synapse_worker.cli.build_distiller, synapse_orchestrator.cli.
# build_npu_distiller, synapse_service.cli._provider). Claude Opus 5's
# context window is 1M tokens (see shared/models.md in the Anthropic API
# skill) -- a genuinely cloud number, not something measured on local
# hardware the way the NPU record above is. response_reserve matches
# AnthropicProvider's own hardcoded max_tokens=16000 (see
# anthropic_provider.py correction #3: thinking is on by default on Opus 5
# and max_tokens caps thinking + text together, so a small reserve here
# would be a lie about how much output room the provider actually asks for).
# prefill_toks_per_sec is illustrative, not measured -- a cloud API isn't
# prefill-bound the way an on-device NPU is, and there is no local hardware
# to time it against. NONE OF THIS MATTERS while [distiller] segment_budget
# is pinned above: the override always wins over whatever this record would
# derive on its own. It exists so the derivation is *defined* (a
# CapabilityError, not silence, if the pin is ever removed and the record is
# looked up) -- see the segment_budget comment for what removing the pin
# would actually produce from these numbers (min(usable_context - overhead -
# response_reserve, prefill_toks_per_sec * max_seconds_per_call) = min(~983k,
# 90,000) = 90,000 -- the exact "90,000-token segments" failure the pin
# exists to prevent).
# The SYNTHESIS model — the reduce half of the pipeline. Recorded 2026-08-06,
# after synthesis silently stopped bumping memory_version for 40 minutes while
# findings kept landing normally.
#
# The cause was that this record did not exist. Every DISTILLER model has one
# and the segmenter derives its budget from it (capability.py: "The budget is
# **never** a shared hard-coded constant"). The synthesizer sat outside that
# system: `AIC100Provider.__init__` carried `max_tokens=800` as a constructor
# default, `SYNTH_SYSTEM` asked for a working memory "under 500 words" (~850
# tokens at the measured 1.7 tok/word), and nothing anywhere compared the two.
# The memory alone overran the output cap, every response was cut off
# mid-object, and the tolerant JSON extractor returned None.
#
# PROBED LIVE, both worth knowing before touching these numbers:
#   * The endpoint accepts max_tokens=3000. 800 was never a limit of the host,
#     only a bound on the shared credit pool.
#   * It reports `finish_reason: "stop"` on a response cut off at exactly the
#     cap. The truncation guard therefore keys on completion_tokens >=
#     max_tokens instead; the finish_reason branch is kept but cannot fire here.
#
# usable_context is the ADVERTISED 128K window — /models on this host returns
# names only, with no max_model_len, so unlike the NPU record below this number
# is not locally measured. It has never bound anything: the largest failing
# synthesis used 2110 input tokens, 1.6% of it. Output is the whole story.
[capability."Llama-3.3-70B"]
usable_context = 128000        # advertised, NOT measured — the host does not report it
prefill_toks_per_sec = 3000.0  # illustrative; a hosted API is not prefill-bound
response_reserve = 1600        # THE number this record exists for — see synthesis.py
notes = "Cirrascale aisuite-indonesia, the synthesis arm (SYNAPSE_SYNTHESIZER=aic100). response_reserve is the output budget SynthesisBudget divides into a working-memory word cap and verdict room; override at runtime with INFERENCE_CLOUD_MAX_TOKENS, and raise INFERENCE_CLOUD_TIMEOUT with it. Rate limits observed 2026-08-06: 20 req/hour and 25,000 tokens/hour per key, so ~7 syntheses/hour at this budget."

[capability."claude-opus-5"]
usable_context = 1000000       # Claude Opus 5's context window; 1M is both the default and the max
prefill_toks_per_sec = 3000.0  # illustrative only -- not measured, see note above
response_reserve = 16000       # matches AnthropicProvider's hardcoded max_tokens
notes = "Claude Opus 5 via the Messages API (packages/providers/src/synapse_providers/anthropic_provider.py). usable_context is the advertised 1M window, not locally measured like the NPU record above. segment_budget is pinned in [distiller] to 2787, so this record's own derivation never actually governs segmentation -- see that comment."

[capability."claude-cli-sonnet"]
usable_context = 200000        # advertised for the CLI's default Sonnet; not locally measured
prefill_toks_per_sec = 3000.0  # illustrative only -- not measured, see note above
response_reserve = 4096        # the CLI exposes no max_tokens flag; this is a budgeting figure only
notes = "Claude via the local `claude` CLI in headless mode (packages/providers/src/synapse_providers/claude_cli_provider.py), on the developer's own subscription -- no API key. Two properties are unlike every other arm: the CLI reports usage.input_tokens as the UNCACHED REMAINDER (~10 for a 31k-token prompt, measured on 2.1.223), so the provider sums it with the two cache fields to keep assert_prompt_conditioned meaningful; and `-p` is an agent, restricted here to one turn with no tools. segment_budget is pinned in [distiller] to 2787, so this record's derivation never governs segmentation."

# Example of a second arm for the bake-off. llama.cpp Q4_0 also lands on the
# Hexagon NPU and, unlike qairt, honours --nctx — so usable_context here is a
# choice rather than a ceiling. Numbers below are UNMEASURED placeholders.
# [capability."Qwen/Qwen3-4B-Instruct-2507-GGUF:Q4_0"]
# usable_context = 8192
# prefill_toks_per_sec = 250.0
# response_reserve = 500
# notes = "UNMEASURED placeholder — do not report numbers from this record."
