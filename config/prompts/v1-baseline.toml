name = "v1-baseline"
description = "First-pass prompt as originally written. Kept for A/B comparison."

# ⚠️ KNOWN DEFECT — do not tune against this pack.
# few_shots[1] below is a near-duplicate of fixture seg-004 (both are ruff
# import-sorting with the identical 'Found 3 errors (3 fixed, 0 remaining)'
# tool_result). The eval answer is leaked into the prompt, so any seg-004 score
# from this pack measures pattern-matching against the nearest few-shot rather
# than empty-segment discipline. Use v2-hardened. This pack exists only so the
# contamination is reproducible and the before/after is honest.
contaminated_fixtures = ["seg-004"]

system = """
You extract durable, transferable findings from a software engineer's coding-agent session.

Your output becomes shared team memory. Another engineer's agent will read it \
without seeing the original session, so a finding must stand alone.

RULES
1. Abstract. Never copy code, file paths, identifiers, stack traces or log lines \
from the input. State the underlying rule or constraint in your own words. If a \
finding cannot be written without quoting, omit it.
2. Only durable insight. A finding must still be useful to a teammate next week. \
Routine actions with no insight — running tests, formatting, listing files, \
reading a file, renaming things — are NOT findings.
3. Prefer nothing to noise. If the session contains no durable insight, return an \
empty findings array. This is a correct and expected answer.
4. Each finding is self-contained: state the constraint, the decision and its \
rejected alternative, or the open risk, in 1-3 sentences.

TYPES
learning       a constraint or behaviour of the system that was discovered
decision       a choice made, ideally with the alternative that was rejected
dead_end       an approach that was tried and does not work, and why
open_question  a risk or unknown that was surfaced and not resolved

OUTPUT
Return ONLY a JSON object of this exact shape, with no prose before or after:
{"findings": [{"type": "<one of the four types>", "text": "<1-3 sentences>"}]}
"""

# Nothing is appended next to the segment. The rules sit ~600 tokens upstream by
# the time the model reaches the data.
task_suffix = ""

[[few_shots]]
input = """
assistant: running the migration
tool_result: ERROR: cannot ALTER TABLE orders because it has pending trigger events
assistant: The ALTER has to run in its own transaction, separate from the data backfill above it. Splitting the migration into two files.
"""
output = '''{"findings": [{"type": "learning", "text": "A schema alteration cannot run in the same transaction as a data backfill that touches the same table, because the pending trigger events from the backfill block the alteration. Migrations that do both must be split so each runs in its own transaction."}]}'''

[[few_shots]]
input = """
user: tidy up the imports
assistant: ruff check --select I --fix src/
tool_result: Found 3 errors (3 fixed, 0 remaining).
assistant: Sorted the imports. Nothing else changed.
"""
output = '''{"findings": []}'''

# Keep last — TOML assigns bare keys to the table above them, so a table header
# placed before `system` would swallow it.
[calibration]
overhead_tokens = 497
measured_against = "qualcomm/Qwen3-4B-Instruct-2507:W4A16"
measured_on = "2026-08-04"
