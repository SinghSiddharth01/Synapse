[project]
name = "synapse-providers"
version = "0.1.0"
description = "ModelProvider implementations for Synapse"
requires-python = ">=3.12"
dependencies = [
    "synapse-contracts",
    "httpx>=0.27",
    "anthropic>=0.69",
]

[tool.uv.sources]
synapse-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synapse_providers"]
