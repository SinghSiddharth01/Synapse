[project]
name = "synapse"
version = "0.1.0"
description = "Shared working memory for AI-assisted teams"
requires-python = ">=3.12"
dependencies = [
    "synapse-contracts",
    "synapse-providers",
    "synapse-distiller",
    "synapse-worker",
    "synapse-orchestrator",
    "synapse-service",
    "synapse-cli",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
synapse-contracts = { workspace = true }
synapse-providers = { workspace = true }
synapse-distiller = { workspace = true }
synapse-worker = { workspace = true }
synapse-orchestrator = { workspace = true }
synapse-service = { workspace = true }
synapse-cli = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-httpserver>=1.1",
    "pytest-cov>=5.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[tool.ruff]
# The dirs the lint job checks are named in ci.yml (packages scripts tests);
# this exclude keeps ad-hoc `ruff check .` from wandering into fixtures,
# generated demo artifacts, or agent worktrees.
extend-exclude = [".claude", ".demo", "fixtures", "packs", "presentation"]

[tool.ruff.lint]
# pycodestyle errors + pyflakes — the PEP8 baseline the CI lint job enforces.
# Deliberately the stable core rather than a maximal ruleset: every rule here
# is a bug or a dead symbol, so a red lint job always means something.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages", "tests"]

[tool.coverage.report]
# The `if __name__ == "__main__": sys.exit(main())` guard in every CLI module
# never executes under pytest (it only runs on direct invocation), and the
# live subprocess script (scripts/verify_orchestrator.py) is what actually
# exercises it. Excluding it keeps 100% a meaningful target instead of a
# number nobody can reach.
exclude_lines = ["if __name__ == .__main__.:"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
