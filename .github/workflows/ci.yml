# CI — the offline suite plus the fake-mode demo rehearsal.
#
# Both jobs are free-tier friendly by design: every test runs offline
# (FakeProvider, no keys, no NPU, no network — a Plan 0 decision), and the
# rehearsal's default mode scripts its model verdicts, so nothing here ever
# touches Cirrascale or spends shared credits. Live-smoke runs stay manual
# and local — do NOT wire INFERENCE_CLOUD_* secrets into Actions.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # No count in the name: it read "717 tests" while the suite ran 724, and a
    # label that asserts a number goes stale on the next commit that adds one.
    # pytest discovers everything under `testpaths` (pyproject.toml), so a new
    # test reaches CI by existing — nothing has to be registered here.
    name: suite (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"   # the repo's floor — local dev runs newer
          enable-cache: true
      - run: uv sync
      - run: uv run pytest -q

  install-path:
    # The first code a joining teammate runs, and until now the only code in
    # the repo with no CI at all: `install.sh` and `scripts/doctor.py` were
    # reachable from README, from serve_local.py's printed banner and from
    # every Windows instruction, and nothing checked that they even parsed.
    # Static and offline: nothing here binds a port or starts the stack.
    name: install path (shell lint + doctor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      # POSIX sh, not bash: this runs under dash on Debian-family boxes, and
      # ubuntu-latest's /bin/sh IS dash, so this is the real parse.
      - run: sh -n install.sh
      - run: shellcheck -s sh install.sh
      - run: test -x install.sh
      - run: uv sync
      # Asserts the result model, not the verdict. Whether a GitHub runner has
      # `claude` or a free 8787 is not this repo's business, and coupling the
      # badge to it would make the badge lie about the code.
      - name: doctor emits a parseable result document
        run: |
          uv run python scripts/doctor.py --json > /tmp/doctor.json
          uv run python -c "import json,sys; d=json.load(open('/tmp/doctor.json')); assert len(d['results'])==8, d; assert d['repo']['branch']"

  rehearsal:
    name: demo rehearsal (fake mode, end to end)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      # Real service + orchestrator subprocesses over real localhost sockets,
      # scripted verdicts: every §B demo beat asserted, including the
      # kill/contribute/restart/resync recovery arc and (since 2026-08-06) the
      # join/leave/re-join/end lifecycle arc. If a beat fails here it would have
      # failed on stage.
      - run: uv run python scripts/rehearse_demo.py
      - name: keep the beat log as an artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: rehearsal-log
          path: .measurements/rehearsal-fake.log
          retention-days: 14
