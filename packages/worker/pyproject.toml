[project]
name = "synapse-worker"
version = "0.1.0"
description = "Edge worker: follow a transcript, segment it, condense on-device, push upstream"
requires-python = ">=3.12"
dependencies = [
    "synapse-contracts",
    "synapse-providers",
    "synapse-distiller",
    "httpx>=0.27",
]

[tool.uv.sources]
synapse-contracts = { workspace = true }
synapse-providers = { workspace = true }
synapse-distiller = { workspace = true }

[project.scripts]
synapse-worker = "synapse_worker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synapse_worker"]
