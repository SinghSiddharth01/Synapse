site_name: Synapse
site_description: Shared working memory for AI-assisted coding teams.
site_url: https://SinghSiddharth01.github.io/Synapse/
repo_url: https://github.com/SinghSiddharth01/Synapse
repo_name: SinghSiddharth01/Synapse
edit_uri: edit/main/docs/

docs_dir: docs

# ⟨decisions/007, 009⟩ In-repo docs published to GitHub Pages, not a wiki.
# See docs/overnight/decisions/007-docs-in-repo-not-wiki.md and
# docs/overnight/decisions/009-mkdocs-material-for-pages.md.

# WHAT DOES NOT GET PUBLISHED.
#
# `docs_dir: docs` means "render everything in docs/", and `validation.nav`
# below only governs whether an unlisted file is a WARNING — not whether it is
# built. Without this block `mkdocs build` emitted the entire internal working
# tree: overnight/ (STATE, LOG, PLAN, FLOW, the scope reviews, the slide
# outline, decisions/), plans/, brainstorming/, superpowers/, HUMAN-TODO.md and
# the raw meeting transcript — 138 of the search index's entries — all
# reachable by direct URL and by full-text search from the Pages front page.
# Absence from the nav hid them from the sidebar and from nothing else.
#
# These are working documents: half-finished plans, an audit that quotes
# unfixed defects, and a transcript of people talking. They stay in the repo,
# where a contributor reads them in context; they do not go on the public site.
exclude_docs: |
  overnight/
  plans/
  brainstorming/
  superpowers/
  HUMAN-TODO.md
  demo-transcripts.txt
  # The generated twin of architecture.md. README.md linked the .html and the
  # nav publishes the .md, so the site carried two copies of one document that
  # can drift apart with nothing to notice.
  architecture.html

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        # Without this, a ```mermaid fence is treated as a code sample and
        # docs/architecture.md's flowchart publishes as literal `flowchart TB`
        # text inside a <pre>. --strict never complained, because a fence
        # rendering as code is valid Markdown, just not a diagram.
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.details

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - packages/contracts/src
            - packages/providers/src
            - packages/distiller/src
            - packages/worker/src
            - packages/orchestrator/src
            - packages/service/src
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            merge_init_into_class: true
            docstring_section_style: list
            filters: ["!^_"]

# ⟨strict-safe⟩ All six writer files (index, first-run, architecture,
# reference/service-http, troubleshooting, contributing) exist and every nav
# target below resolves, so the build can afford to treat a warning as an
# error. (Earlier revisions of this comment pointed at a "SETUP section above"
# that was never written; there is no such section, and this paragraph is the
# whole instruction.)
strict: true
validation:
  nav:
    # Historical/scratch docs (plans/, brainstorming/, overnight/, superpowers/
    # specs) are deliberately not in the nav — see "Historical documents stay
    # historical" in docs/contributing.md. Presence in docs/ without a nav
    # entry is expected here, not a mistake to chase.
    omitted_files: ignore
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - First run: first-run.md
  - Architecture: architecture.md
  - Reference:
      - Service HTTP: reference/service-http.md
      - MCP tools: reference/mcp-tools.md
      - API:
          - synapse_contracts: reference/api/contracts.md
          - synapse_providers: reference/api/providers.md
          - synapse_distiller: reference/api/distiller.md
          - synapse_worker: reference/api/worker.md
          - synapse_orchestrator: reference/api/orchestrator.md
          - synapse_service: reference/api/service.md
  - Troubleshooting: troubleshooting.md
  - Contributing: contributing.md
  - Architecture Decision Records:
      - 0001 — Local orchestrator: adr/0001-local-orchestrator.md
      - 0002 — Semantic merge and tombstones: adr/0002-semantic-merge-and-tombstones.md
      - 0003 — Distiller compresses, does not judge: adr/0003-distiller-compresses-rather-than-judges.md
      - 0004 — The log is append-only, state is a fold: adr/0004-the-log-is-append-only-and-state-is-a-fold.md
      - 0005 — Synthesis output budget is derived: adr/0005-the-synthesis-output-budget-is-derived.md
