[project]
name = "synapse-service"
version = "0.1.0"
description = "Shared Memory: append-only log, derived view, candidate selection"
requires-python = ">=3.12"
dependencies = [
    "synapse-contracts",
]

[tool.uv.sources]
synapse-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synapse_service"]
