[project]
name = "synapse-cli"
version = "0.1.0"
description = "Synapse client CLI: configure once, `synapse up` to run, `synapse health` to inspect"
requires-python = ">=3.12"
dependencies = [
    # The CLIENT bundle, in full: everything a consumer machine runs, and
    # nothing the server runs. synapse-service is deliberately absent — the
    # two halves install, version and ship independently, and a consumer
    # machine should never even have the service importable.
    "synapse-contracts",
    "synapse-providers",
    "synapse-distiller",
    "synapse-worker",
    "synapse-orchestrator",
    "httpx>=0.27",
]

[project.scripts]
synapse = "synapse_cli.main:main"

[tool.uv.sources]
synapse-contracts = { workspace = true }
synapse-providers = { workspace = true }
synapse-distiller = { workspace = true }
synapse-worker = { workspace = true }
synapse-orchestrator = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synapse_cli"]

# The Claude Code awareness pack rides along inside the wheel. `synapse
# configure` installs it into ~/.claude, and the people that step exists for
# are exactly the ones who never cloned this repo — resolving it relative to
# the source tree would work on developer machines and nowhere else.
#
# Targeting the SDIST, not the wheel, for the same load-bearing reason spelled
# out in packages/distiller/pyproject.toml: the wheel builds from the sdist, so
# a wheel-level force-include of ../../packs resolves against the extracted
# sdist tree where that path does not exist, and every `uv build` dies with
# "Forced include not found". Verified by hitting it.
[tool.hatch.build.targets.sdist.force-include]
"../../packs/claude-code" = "src/synapse_cli/pack"

# The sdist route above never runs for a wheel built DIRECTLY from the tree
# (`uv tool install --from packages/cli`, `uv build --wheel`) — such wheels
# shipped without the pack and `synapse configure` said "pack not installed".
# The hook force-includes the canonical packs/ when building from a checkout
# and no-ops on the sdist path. Same defect and fix as the distiller's
# prompt data; see hatch_build.py.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
