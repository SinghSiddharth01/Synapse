[project]
name = "synapse-cli"
version = "0.1.0"
description = "Synapse client CLI: configure once, `synapse up` to run, `synapse health` to inspect"
requires-python = ">=3.12"
dependencies = [
    # The CLIENT bundle, in full: everything a consumer machine runs, and
    # nothing the server runs. synapse-service is deliberately absent — the
    # two halves install, version and ship independently, and a consumer
    # machine should never even have the service importable.
    "synapse-contracts",
    "synapse-providers",
    "synapse-distiller",
    "synapse-worker",
    "synapse-orchestrator",
    "httpx>=0.27",
]

[project.scripts]
synapse = "synapse_cli.main:main"

[tool.uv.sources]
synapse-contracts = { workspace = true }
synapse-providers = { workspace = true }
synapse-distiller = { workspace = true }
synapse-worker = { workspace = true }
synapse-orchestrator = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synapse_cli"]
