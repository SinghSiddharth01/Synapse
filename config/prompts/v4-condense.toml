name = "v4-condense"
description = "The NPU compresses and abstracts; it does not judge importance. Judgment moves to triage (upstream) and synthesis (downstream)."

# WHY THIS PACK EXISTS
#
# v1-v3 asked a 4B model to do four jobs at once: abstract, decide durability,
# choose granularity, and classify. Measured on the NPU 2026-08-04, across six
# configurations, it did the first reliably and the others not at all:
#
#   abstraction        verbatim overlap 0.00-0.07 throughout        ✓
#   JSON format        clean, first attempt, zero retries           ✓
#   durability         invented a finding from pure noise, 6/6      ✗
#   granularity        merged a dead_end into a decision            ✗
#   factual fidelity   reversed a comparison stated twice in the
#                      prompt ("reuse ratio is much lower" ->
#                      "enabling sustained connection reuse")       ✗
#
# So this pack asks for only the thing that worked. Durability judgment belongs
# upstream in deterministic triage; classification, dedup and the trivia filter
# belong downstream in synthesis, which is service-side, larger, and where
# FindingStatus.TRIVIAL is already documented as being written.
#
# RULE 1 IS THE POINT. The factual inversion is the most dangerous behaviour
# measured — a wrong finding reaches teammates looking identical to a right one,
# and it passed every guard (canary ok, prompt_tokens ok, schema-valid,
# verbatim 0.00). It happened while the model was composing a decision narrative
# rather than restating claims. The hypothesis this pack tests is that fidelity
# improves when the model is not also synthesizing.
#
# EXPECT seg-004 TO PRODUCE A NOTE. Its golden empty array encodes "the distiller
# should judge this worthless", which is no longer the distiller's job. That
# fixture now tests triage, not this.
contaminated_fixtures = []

# This pack does not ask the model to decide what is worth keeping, so an
# all-noise fixture producing notes is correct behaviour here, not a failure.
# The eval harness reads this flag and labels seg-004 accordingly. Filtering is
# triage's job upstream and synthesis's job downstream.
judges_durability = false

system = """
You rewrite part of a software engineer's coding-agent session as a short list of notes.

Your only job is to make it SHORTER and SELF-CONTAINED. You are not deciding what \
matters — something else does that afterwards. Write down what the session says, \
briefly, in your own words.

RULES
1. Preserve every claim exactly as the session states it. If the session says one \
option has lower reuse, worse latency, or higher cost than another, your note says \
lower, worse, higher — in that direction. Never reverse a comparison. Never turn a \
drawback into a benefit. Never add an advantage the session did not claim. Where \
what the session says conflicts with what you would expect to be true, follow the \
session.
2. Use your own words. Do not copy code, file paths, identifiers, config keys, \
variable names, hostnames, stack traces or log lines. Refer to them by description \
instead — "the pool size setting", not the setting's name.
3. One note per distinct point. If the session tried something, abandoned it, chose \
something else, and left a question open, that is four notes, not one. Do not \
combine points into a narrative.
4. Add nothing. No advice, no conclusions the session did not reach, no background \
knowledge of your own.
5. Each note is one or two sentences and makes sense to someone who never saw the \
session.

Label each note with whichever fits best:
learning       something about how the system behaves
decision       a choice that was made
dead_end       something tried that did not work
open_question  something left unresolved

OUTPUT
Return ONLY a JSON object of this exact shape, with no prose before or after:
{"findings": [{"type": "<label>", "text": "<one or two sentences>"}]}
"""

task_suffix = """

---
Rewrite the session above as notes. One note per distinct point — do not combine \
them. Keep every comparison pointing the same way the session pointed it. Use no \
identifiers, config keys or paths.
"""

# READ THIS BEFORE EDITING EITHER FEW-SHOT BELOW.
#
# On 2026-08-06 these two example outputs came back as findings. One contributed
# paragraph produced nine notes and six were these, paraphrased, filed under a
# named engineer as their own verified experience — brokers and template caches
# the contributor never mentioned. Recorded as F1 in
# docs/overnight/w7-live-evidence.md, reproduced on both runs.
#
# Two things now stand between an example and a teammate's screen:
#
#   1. packages/providers/.../claude_cli_provider.py:_flatten_prompt marks these
#      as examples in the prompt text. That arm gets one prompt string rather
#      than a turn list, and joining the turns had erased every signal that they
#      were examples at all, while the suffix above says "the session above".
#   2. packages/distiller/.../distiller.py:is_example_echo drops any returned
#      note that is a near-duplicate of an example, whatever produced it. Its
#      corpus is derived from these few-shots via
#      PromptPack.example_finding_texts, so an example added here is guarded the
#      moment it is added — nothing to remember, nothing to keep in step.
#
# What that means for an editor: adding or rewording an example is safe, and the
# guard follows you. Adding one whose note reads like something a real session
# would genuinely produce is NOT safe — that is the one shape the guard cannot
# separate from real work, and it would silently eat the real one instead.
#
# The prose in `system` and `task_suffix` above is deliberately untouched by that
# fix, because calibration.overhead_tokens below is measured on the NPU's own
# tokenizer and feeds the pinned segment_budget in config/synapse.toml with zero
# headroom (4096 - 809 - 500 = 2787 exactly). Hardening that costs tokens has to
# wait for a machine that can re-measure.

# Few-shot 1 — the fidelity case. The session states a drawback of the option it
# chose. The note keeps the drawback, and keeps it pointing the same way. This is
# the behaviour the model failed at, so it is demonstrated first.
[[few_shots]]
input = """
developer: the queue is dropping messages under load, can you switch it to the durable broker?
agent: Moved the queue over to the durable broker. Worth noting the throughput is roughly a third of what the in-memory queue managed, because every message now waits on a disk write before it is acknowledged. That is the cost of not losing messages.
"""
output = '''{"findings": [{"type": "decision", "text": "The message queue was switched to the durable broker so that messages are not lost under load."}, {"type": "learning", "text": "The durable broker's throughput is roughly a third of the in-memory queue's, because each message waits for a disk write before being acknowledged. Durability is paid for in throughput."}]}'''

# Few-shot 2 — the granularity case. One short session, four distinct points,
# four notes. Splitting is shown rather than described.
[[few_shots]]
input = """
agent: Tried caching the rendered templates in process memory, but each worker keeps its own copy and they drift apart after a deploy, so users saw stale pages depending on which worker answered. Moved the cache to the shared store instead, which every worker reads from. Adds a network hop on every render. I have not measured what that does to page latency yet.
"""
output = '''{"findings": [{"type": "dead_end", "text": "Caching rendered templates in each worker's own memory does not work across multiple workers: the copies drift apart after a deploy, so users get stale pages depending on which worker serves them."}, {"type": "decision", "text": "The template cache was moved to a shared store that every worker reads from, replacing the per-worker in-memory cache."}, {"type": "learning", "text": "Serving the template cache from a shared store adds a network round trip to every render."}, {"type": "open_question", "text": "The effect of that extra network hop on page latency has not been measured."}]}'''

# Measured via scripts/calibrate_prompt.py. Re-run after ANY edit above — a
# stale number oversizes the segment budget and truncates segments silently.
# Keep last — TOML assigns bare keys to the table above them.
[calibration]
overhead_tokens = 809
measured_against = "qualcomm/Qwen3-4B-Instruct-2507:W4A16"
measured_on = "2026-08-04"
